# Доступ к MongoDB только у игрового сервера: даже если в кластере
# появится что-то ещё, до базы оно не достучится.
# Работает в кластерах с поддержкой NetworkPolicy (Calico, Cilium и др.).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-allow-minecraft-only
  labels:
    app.kubernetes.io/part-of: hotpotato
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minecraft
      ports:
        - protocol: TCP
          port: 27017
