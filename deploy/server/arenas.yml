# Готовая арена для плоского мира (LEVEL_TYPE=FLAT): поверхность на высоте -60.
# Лобби в центре, 8 точек появления по кругу радиусом 12 блоков лицом к центру.
# Мир ограничен границей 48×48 (команды RCON_CMDS_STARTUP в docker-compose и Kubernetes).
